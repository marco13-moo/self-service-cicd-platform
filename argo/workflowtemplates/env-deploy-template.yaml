apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: env-deploy-template
  namespace: argo
spec:
  serviceAccountName: argo-env-admin
  entrypoint: build-and-deploy
  arguments:
    parameters:
      - name: env_name
      - name: service
      - name: repository
      - name: commit_sha
      - name: project_type
      - name: image_ref
      - name: image_repository
      - name: container_port
      - name: dockerfile
      - name: preview_host
      - name: preview_url
      - name: builder_image
      - name: registry_secret_name
      - name: registry_insecure
      - name: scanner_image
      - name: vulnerability_severities
      - name: ignore_unfixed
      - name: target_platform
      - name: cosign_image
      - name: cosign_private_key_secret
      - name: cosign_public_key_secret
      - name: vex_config_map
  volumes:
    - name: buildkit-state
      emptyDir: {}
    - name: registry-credentials
      secret:
        secretName: "{{workflow.parameters.registry_secret_name}}"
        optional: true
    - name: cosign-private-key
      secret:
        secretName: "{{workflow.parameters.cosign_private_key_secret}}"
    - name: cosign-public-key
      secret:
        secretName: "{{workflow.parameters.cosign_public_key_secret}}"
    - name: vulnerability-exceptions
      configMap:
        name: "{{workflow.parameters.vex_config_map}}"
        optional: true
  templates:
    - name: build-and-deploy
      dag:
        tasks:
          - name: build
            template: build-image
          - name: vulnerability-policy
            dependencies: [build]
            template: vulnerability-policy
            arguments:
              parameters:
                - name: image_digest
                  value: "{{tasks.build.outputs.parameters.image-digest}}"
          - name: deploy
            dependencies: [verify-signature]
            template: deploy-workload
            arguments:
              parameters:
                - name: image_digest
                  value: "{{tasks.build.outputs.parameters.image-digest}}"
          - name: sign-image
            dependencies: [vulnerability-policy]
            template: sign-image
            arguments:
              parameters:
                - name: image_digest
                  value: "{{tasks.build.outputs.parameters.image-digest}}"
          - name: verify-signature
            dependencies: [sign-image]
            template: verify-signature
            arguments:
              parameters:
                - name: image_digest
                  value: "{{tasks.build.outputs.parameters.image-digest}}"
    - name: build-image
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: "{{workflow.parameters.repository}}"
              revision: "{{workflow.parameters.commit_sha}}"
      container:
        image: "{{workflow.parameters.builder_image}}"
        workingDir: /workspace
        command: [sh, -c]
        args:
          - |
            set -eu
            buildctl-daemonless.sh build \
              --frontend dockerfile.v0 \
              --local context=/workspace \
              --local dockerfile=/workspace \
              --opt 'filename={{workflow.parameters.dockerfile}}' \
              --opt 'platform={{workflow.parameters.target_platform}}' \
              --output 'type=image,name={{workflow.parameters.image_ref}},push=true,registry.insecure={{workflow.parameters.registry_insecure}}' \
              --metadata-file /tmp/build-metadata.json \
              --opt attest:sbom= \
              --opt attest:provenance=mode=max
            digest=$(sed -n 's/^[[:space:]]*"containerimage.digest":[[:space:]]*"\(sha256:[a-f0-9]\{64\}\)".*/\1/p' /tmp/build-metadata.json)
            test -n "$digest"
            printf '%s' "$digest" > /tmp/image-digest
        env:
          - name: BUILDKITD_FLAGS
            value: --oci-worker-no-process-sandbox
          - name: DOCKER_CONFIG
            value: /home/user/.docker
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
        volumeMounts:
          - name: buildkit-state
            mountPath: /home/user/.local/share/buildkit
          - name: registry-credentials
            mountPath: /home/user/.docker
            readOnly: true
      outputs:
        parameters:
          - name: image-digest
            valueFrom:
              path: /tmp/image-digest
            globalName: image-digest

    - name: vulnerability-policy
      inputs:
        parameters:
          - name: image_digest
      container:
        image: "{{workflow.parameters.scanner_image}}"
        command: [sh, -c]
        args:
          - |
            set -eu
            tag='{{workflow.parameters.image_ref}}'
            digest='{{inputs.parameters.image_digest}}'
            image="${tag%:*}@${digest}"
            insecure=""
            ignore_unfixed=""
            if [ '{{workflow.parameters.registry_insecure}}' = true ]; then
              insecure="--insecure"
            fi
            if [ '{{workflow.parameters.ignore_unfixed}}' = true ]; then
              ignore_unfixed="--ignore-unfixed"
            fi
            vex=""
            if [ -f /vex/openvex.json ]; then
              test -s /vex/governance.env
              # governance.env is deliberately data, never sourced as shell.
              expires_at=$(sed -n 's/^expires_at=//p' /vex/governance.env)
              approved_by=$(sed -n 's/^approved_by=//p' /vex/governance.env)
              ticket=$(sed -n 's/^ticket=//p' /vex/governance.env)
              test -n "$expires_at" && test -n "$approved_by" && test -n "$ticket"
              expires_epoch=$(date -u -d "$expires_at" +%s)
              test "$expires_epoch" -gt "$(date -u +%s)"
              vex="--vex /vex/openvex.json"
              echo "Applying approved VEX exception set ${ticket}; expires ${expires_at}"
            fi
            # Generate a secondary CycloneDX inventory for cross-tool
            # validation; the SPDX BuildKit attestation remains registry-resident.
            trivy image $insecure --platform '{{workflow.parameters.target_platform}}' --format cyclonedx --output /tmp/sbom.cdx.json "$image"
            trivy image $insecure $ignore_unfixed $vex --platform '{{workflow.parameters.target_platform}}' --scanners vuln --exit-code 1 \
              --severity '{{workflow.parameters.vulnerability_severities}}' "$image"
            echo "Vulnerability policy passed for ${image}"
        env:
          - name: DOCKER_CONFIG
            value: /root/.docker
        volumeMounts:
          - name: registry-credentials
            mountPath: /root/.docker
            readOnly: true
          - name: vulnerability-exceptions
            mountPath: /vex
            readOnly: true

    - name: sign-image
      inputs:
        parameters:
          - name: image_digest
      container:
        image: "{{workflow.parameters.cosign_image}}"
        command: [cosign]
        args:
          - sign
          - --yes
          - --key
          - /cosign-private/cosign.key
          - --use-signing-config=false
          - --tlog-upload=false
          - --registry-referrers-mode=legacy
          - --allow-insecure-registry={{workflow.parameters.registry_insecure}}
          - --allow-http-registry={{workflow.parameters.registry_insecure}}
          - "{{workflow.parameters.image_repository}}@{{inputs.parameters.image_digest}}"
        env:
          - name: COSIGN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{workflow.parameters.cosign_private_key_secret}}"
                key: password
                optional: true
          - name: DOCKER_CONFIG
            value: /home/nonroot/.docker
        volumeMounts:
          - name: cosign-private-key
            mountPath: /cosign-private
            readOnly: true
          - name: registry-credentials
            mountPath: /home/nonroot/.docker
            readOnly: true

    - name: verify-signature
      inputs:
        parameters:
          - name: image_digest
      container:
        image: "{{workflow.parameters.cosign_image}}"
        command: [cosign]
        args:
          - verify
          - --key
          - /cosign-public/cosign.pub
          - --insecure-ignore-tlog
          - --registry-referrers-mode=legacy
          - --allow-insecure-registry={{workflow.parameters.registry_insecure}}
          - --allow-http-registry={{workflow.parameters.registry_insecure}}
          - "{{workflow.parameters.image_repository}}@{{inputs.parameters.image_digest}}"
        env:
          - name: DOCKER_CONFIG
            value: /home/nonroot/.docker
        volumeMounts:
          - name: cosign-public-key
            mountPath: /cosign-public
            readOnly: true
          - name: registry-credentials
            mountPath: /home/nonroot/.docker
            readOnly: true

    - name: deploy-workload
      inputs:
        parameters:
          - name: image_digest
      script:
        image: bitnami/kubectl@sha256:e0fcb25c485a8ad0665d0dd4b4a67cefb6baee32b0e3b19f54f1b468c49c1ed5
        command: [sh]
        source: |
          set -eu
          namespace='{{workflow.parameters.env_name}}'
          tag='{{workflow.parameters.image_ref}}'
          digest='{{inputs.parameters.image_digest}}'
          image="${tag%:*}@${digest}"
          port='{{workflow.parameters.container_port}}'
          host='{{workflow.parameters.preview_host}}'
          kubectl -n "$namespace" apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: preview
            labels:
              app.kubernetes.io/name: preview
              app.kubernetes.io/managed-by: self-service-cicd
              platform.service: '{{workflow.parameters.service}}'
              platform.environment: '{{workflow.parameters.env_name}}'
              platform.revision: '{{workflow.parameters.commit_sha}}'
              platform.project-type: '{{workflow.parameters.project_type}}'
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: preview
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: preview
                  platform.service: '{{workflow.parameters.service}}'
                  platform.environment: '{{workflow.parameters.env_name}}'
                  platform.revision: '{{workflow.parameters.commit_sha}}'
              spec:
                containers:
                  - name: application
                    image: ${image}
                    imagePullPolicy: Always
                    ports:
                      - name: http
                        containerPort: ${port}
                    readinessProbe:
                      tcpSocket:
                        port: http
                    livenessProbe:
                      tcpSocket:
                        port: http
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: preview
          spec:
            selector:
              app.kubernetes.io/name: preview
            ports:
              - name: http
                port: ${port}
                targetPort: http
          EOF
          if [ -n "$host" ]; then
            kubectl -n "$namespace" apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: preview
          spec:
            rules:
              - host: ${host}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: preview
                          port:
                            name: http
          EOF
          else
            kubectl -n "$namespace" delete ingress preview --ignore-not-found
          fi
          kubectl -n "$namespace" rollout status deployment/preview --timeout=5m
          echo "Preview converged at {{workflow.parameters.preview_url}}"
