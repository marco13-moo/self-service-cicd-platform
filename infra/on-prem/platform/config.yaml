apiVersion: v1
kind: ConfigMap
metadata:
  name: on-prem-platform
  namespace: control-plane
data:
  preview-domain: preview.internal
  registry: harbor.harbor.svc.cluster.local/library/previews
  argo-ui: http://argo-server.argo.svc.cluster.local
  vault-address: http://vault.vault.svc.cluster.local:8200
  vault-role: self-service-cicd-signer
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: control-plane
  namespace: control-plane
  labels:
    release: monitoring
spec:
  namespaceSelector: {matchNames: [control-plane]}
  selector: {matchLabels: {app: control-plane}}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
