apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-service-cicd-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git.git-system.svc.cluster.local/platform/self-service-cicd-platform.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: control-plane
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
