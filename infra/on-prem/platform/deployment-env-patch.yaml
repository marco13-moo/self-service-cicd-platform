- op: replace
  path: /spec/template/spec/containers/0/env
  value:
    - name: DATABASE_URL
      valueFrom: {secretKeyRef: {name: control-plane-database, key: url}}
    - {name: ARGO_NAMESPACE, value: argo}
    - name: ARGO_UI_BASE_URL
      valueFrom: {configMapKeyRef: {name: on-prem-platform, key: argo-ui}}
    - name: PREVIEW_IMAGE_REPOSITORY
      valueFrom: {configMapKeyRef: {name: on-prem-platform, key: registry}}
    - name: PREVIEW_BASE_DOMAIN
      valueFrom: {configMapKeyRef: {name: on-prem-platform, key: preview-domain}}
    - {name: PREVIEW_URL_SCHEME, value: https}
    - {name: PREVIEW_ENVIRONMENT_TTL, value: 2h}
    - {name: PREVIEW_BUILDER_IMAGE, value: "moby/buildkit:v0.33.0-rootless"}
    - {name: PREVIEW_SCANNER_IMAGE, value: "aquasec/trivy:0.74.0"}
    - {name: PREVIEW_COSIGN_IMAGE, value: "ghcr.io/sigstore/cosign/cosign:v2.6.4"}
    - {name: PREVIEW_VAULT_IMAGE, value: "hashicorp/vault:1.20.4"}
    - {name: PREVIEW_REGISTRY_SECRET, value: registry-credentials}
    - {name: PREVIEW_REGISTRY_INSECURE, value: "true"}
    - {name: PREVIEW_SIGNING_PROFILE, value: kms}
    - {name: PREVIEW_COSIGN_SIGNER, value: "hashivault://preview-signing-{tenant}"}
    - {name: PREVIEW_COSIGN_AUTH_MODE, value: vault-kubernetes}
    - name: PREVIEW_VAULT_ADDR
      valueFrom: {configMapKeyRef: {name: on-prem-platform, key: vault-address}}
    - name: PREVIEW_VAULT_ROLE
      valueFrom: {configMapKeyRef: {name: on-prem-platform, key: vault-role}}
    - {name: PREVIEW_COSIGN_PUBLIC_KEY_SECRET, value: preview-cosign-public}
    - {name: PREVIEW_VEX_CONFIGMAP, value: preview-vex-none}
    - {name: PREVIEW_VULNERABILITY_SEVERITIES, value: CRITICAL}
    - {name: PREVIEW_VULNERABILITY_IGNORE_UNFIXED, value: "true"}
    - {name: PREVIEW_TARGET_PLATFORM, value: linux/arm64}
    - {name: GITHUB_API_BASE_URL, value: "http://git-api.git-system.svc.cluster.local"}
    - {name: GITHUB_CLONE_BASE_URL, value: "http://git.git-system.svc.cluster.local"}
    - name: GITHUB_WEBHOOK_SECRET
      valueFrom: {secretKeyRef: {name: github-app, key: webhook-secret}}
    - name: TENANT_AUTH_TOKENS
      valueFrom: {secretKeyRef: {name: control-plane-tenant-auth, key: tokens.json, optional: true}}
    - name: CONTROL_PLANE_ADMIN_TOKEN
      valueFrom: {secretKeyRef: {name: control-plane-admin, key: token, optional: true}}
