apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: on-prem-self-signed}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: on-prem-root, namespace: cert-manager}
spec:
  isCA: true
  commonName: self-service-cicd-on-prem-root
  secretName: on-prem-root-ca
  issuerRef: {name: on-prem-self-signed, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: on-prem-ca}
spec: {ca: {secretName: on-prem-root-ca}}
