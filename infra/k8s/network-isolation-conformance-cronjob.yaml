apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/managed-by: self-service-cicd
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-conformance
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-conformance
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete", "patch"]
  - apiGroups: ["", "apps", "networking.k8s.io", "cilium.io", "gateway.networking.k8s.io"]
    resources: ["pods", "pods/log", "pods/exec", "services", "deployments", "networkpolicies", "ciliumnetworkpolicies", "httproutes"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-conformance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-conformance
subjects:
  - kind: ServiceAccount
    name: network-conformance
    namespace: platform-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenant-network-isolation-conformance
  namespace: platform-system
  labels:
    app.kubernetes.io/managed-by: self-service-cicd
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tenant-network-isolation-conformance
        spec:
          restartPolicy: Never
          serviceAccountName: network-conformance
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: conformance
              # Local conformance loads this exact image into kind. Production
              # promotion replaces it with the signed registry digest.
              # Supplied by the same signed release as the control plane.
              image: "${NETWORK_CONFORMANCE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
