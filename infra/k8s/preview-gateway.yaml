apiVersion: v1
kind: Namespace
metadata:
  name: preview-gateway
  labels:
    platform.preview-ingress: "true"
    app.kubernetes.io/managed-by: self-service-cicd
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-preview
  namespace: preview-gateway
  labels:
    platform.tenant: platform
spec:
  gatewayClassName: cilium
  listeners:
    - name: http-conformance
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: self-service-cicd
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.preview.example.test"
      tls:
        mode: Terminate
        certificateRefs:
          - name: preview-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: self-service-cicd
