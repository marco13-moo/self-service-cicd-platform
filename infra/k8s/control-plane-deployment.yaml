apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: control-plane
spec:
  replicas: 3
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: control-plane
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: control-plane
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          # Render from a verified platform.release/v1 manifest. Kubernetes
          # receives a digest; this placeholder must never be applied directly.
          image: "${CONTROL_PLANE_IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          env:
            - name: ARGO_NAMESPACE
              value: argo
            - name: ARGO_UI_BASE_URL
              value: http://argo-server.argo.svc
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: webhook-secret
                  optional: true
            - name: BITBUCKET_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: webhook-secret
                  optional: true
            - name: PREVIEW_ENVIRONMENT_TTL
              value: 2h
            - name: PREVIEW_IMAGE_REPOSITORY
              value: registry.example.com/platform-previews
            - name: PREVIEW_BUILDER_IMAGE
              value: moby/buildkit:v0.33.0-rootless
            - name: PREVIEW_REGISTRY_SECRET
              value: registry-credentials
            - name: PREVIEW_SCANNER_IMAGE
              value: aquasec/trivy:0.74.0
            - name: PREVIEW_COSIGN_SIGNER
              valueFrom:
                configMapKeyRef:
                  # Production sets a KMS URI here; signer credentials are
                  # furnished to Argo through workload identity, never config.
                  name: preview-trust
                  key: cosign-signer
                  optional: true
            - name: PREVIEW_SIGNING_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: preview-trust
                  key: signing-profile
                  optional: true
            - name: PREVIEW_COSIGN_AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: preview-trust
                  key: cosign-auth-mode
                  optional: true
            - name: PREVIEW_VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: preview-trust
                  key: vault-address
                  optional: true
            - name: PREVIEW_VAULT_ROLE
              valueFrom:
                configMapKeyRef:
                  name: preview-trust
                  key: vault-role
                  optional: true
            - name: PREVIEW_POLICY_PREDICATE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: preview-trust
                  key: policy-predicate-type
                  optional: true
            - name: PREVIEW_VULNERABILITY_SEVERITIES
              value: CRITICAL
            - name: PREVIEW_VULNERABILITY_IGNORE_UNFIXED
              value: "true"
            - name: PREVIEW_TARGET_PLATFORM
              value: linux/amd64
            - name: BITBUCKET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: repository-token
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
                  optional: false
            - name: TENANT_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: control-plane-tenant-auth
                  key: tokens.json
                  # Optional after tenant OIDC providers are persisted. Retain
                  # only a separately governed break-glass token in production.
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: app-id
                  optional: true
            - name: CONTROL_PLANE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-admin
                  key: token
                  optional: true
            - name: GITHUB_PRIVATE_KEY_PATH
              value: /var/run/secrets/github/private-key.pem
            - name: BITBUCKET_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: oauth-client-id
                  optional: true
            - name: BITBUCKET_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: oauth-client-secret
                  optional: true
          volumeMounts:
            - name: github-private-key
              mountPath: /var/run/secrets/github
              readOnly: true
      volumes:
        - name: github-private-key
          secret:
            secretName: github-app
            optional: true
            items:
              - key: private-key.pem
                path: private-key.pem
