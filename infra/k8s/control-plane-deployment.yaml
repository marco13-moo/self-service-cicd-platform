apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: control-plane:phase7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          env:
            - name: STATE_PATH
              value: /var/lib/control-plane/state.json
            - name: ARGO_NAMESPACE
              value: argo
            - name: ARGO_UI_BASE_URL
              value: http://argo-server.argo.svc
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: webhook-secret
                  optional: true
            - name: BITBUCKET_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: webhook-secret
                  optional: true
            - name: PREVIEW_ENVIRONMENT_TTL
              value: 2h
            - name: BITBUCKET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: repository-token
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: app-id
                  optional: true
            - name: CONTROL_PLANE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-admin
                  key: token
                  optional: true
            - name: GITHUB_PRIVATE_KEY_PATH
              value: /var/run/secrets/github/private-key.pem
            - name: BITBUCKET_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: oauth-client-id
                  optional: true
            - name: BITBUCKET_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitbucket-app
                  key: oauth-client-secret
                  optional: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/control-plane
            - name: github-private-key
              mountPath: /var/run/secrets/github
              readOnly: true
      volumes:
        # Replace this with a PersistentVolumeClaim for multi-replica or
        # node-independent durability. The file repository is single-writer.
        - name: state
          persistentVolumeClaim:
            claimName: control-plane-state
        - name: github-private-key
          secret:
            secretName: github-app
            optional: true
            items:
              - key: private-key.pem
                path: private-key.pem
