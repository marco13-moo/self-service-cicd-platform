apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: control-plane:phase7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          env:
            - name: STATE_PATH
              value: /var/lib/control-plane/state.json
            - name: ARGO_NAMESPACE
              value: argo
            - name: ARGO_UI_BASE_URL
              value: http://argo-server.argo.svc
          volumeMounts:
            - name: state
              mountPath: /var/lib/control-plane
      volumes:
        # Replace this with a PersistentVolumeClaim for multi-replica or
        # node-independent durability. The file repository is single-writer.
        - name: state
          persistentVolumeClaim:
            claimName: control-plane-state
