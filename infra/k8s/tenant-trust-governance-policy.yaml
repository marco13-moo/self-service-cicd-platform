apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-preview-trust-governance
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: >-
        !(object.metadata.name.startsWith('preview-cosign-public-') ||
          object.metadata.name.startsWith('preview-cosign-private-')) ||
        (has(object.metadata.labels) &&
         'platform.tenant' in object.metadata.labels &&
         object.metadata.name.endsWith('-' + object.metadata.labels['platform.tenant']))
      message: tenant trust Secrets must carry the matching immutable tenant suffix
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-preview-trust-governance
spec:
  policyName: tenant-preview-trust-governance
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argo
