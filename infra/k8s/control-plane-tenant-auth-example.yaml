apiVersion: v1
kind: Secret
metadata:
  name: control-plane-tenant-auth
  namespace: control-plane
type: Opaque
stringData:
  # Illustrative bootstrap credentials only. Generate high-entropy tokens in a
  # secret manager and remove ordinary static credentials after OIDC cutover.
  # Never commit real bearer tokens.
  tokens.json: |
    {
      "replace-with-secret-manager-token": {
        "subject": "platform-bootstrap",
        "tenant_id": "default",
        "role": "admin",
        "platform_admin": true
      }
    }
