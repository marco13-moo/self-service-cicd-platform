apiVersion: v1
kind: Namespace
metadata:
  name: kms-conformance
  labels:
    platform.kms-conformance: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: kms-conformance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-vault-kms-conformance-key-reader
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["preview-cosign-public-conformance"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-vault-kms-conformance-key-reader
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-vault-kms-conformance-key-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-kms-conformance-token-reviewer
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: kms-conformance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: kms-conformance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:1.20.4
          args: [server, -dev, -dev-root-token-id=conformance-root, -dev-listen-address=0.0.0.0:8200]
          securityContext:
            capabilities:
              add: [IPC_LOCK]
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: kms-conformance
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: http
